<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>濮乐购.会员权益中心</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue","Microsoft YaHei",sans-serif;background:#f4f5f7;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.box{background:#fff;border-radius:18px;padding:34px 24px;width:100%;max-width:330px;text-align:center;box-shadow:0 10px 36px rgba(0,0,0,.08)}
.icon{width:70px;height:70px;border-radius:50%;background:#22a06b;color:#fff;display:flex;align-items:center;justify-content:center;font-size:38px;margin:0 auto 16px}
h1{font-size:22px;color:#222;font-weight:700}
p{font-size:13px;color:#999;margin-top:10px;line-height:1.8}
.code{margin-top:20px;padding-top:16px;border-top:1px dashed #e5e5e5;font-family:Consolas,Menlo,monospace;font-size:15px;color:#666;letter-spacing:1px}
.foot{margin-top:22px;font-size:11px;color:#bbb;line-height:1.8}
</style>
</head>
<body>
<div class="box">
  <div class="icon">✓</div>
  <h1>谢谢合作</h1>
  <p>核销已完成，感谢您的配合</p>
  <div class="code" id="code">核销码：--</div>
  <div class="foot">濮乐购 · 会员权益中心<br>客服 0393-618 0000</div>
</div>
<script>
  var m=location.search.match(/[?&]code=([^&]+)/);
  if(m) document.getElementById('code').textContent='核销码：'+decodeURIComponent(m[1]);
</script>
</body>
</html>
